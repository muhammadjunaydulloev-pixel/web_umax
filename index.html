<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rӯйи Ман AI — Ёрдамчии нигоҳубини намуди зоҳирӣ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
  --accent1:#8B5CF6; --accent2:#22D3EE; --amber:#F5A623; --danger:#F26D6D; --good:#3DDC97;
  --grad: linear-gradient(135deg, var(--accent1), var(--accent2));
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#080a12; --bg2:#0d1120; --surface:rgba(255,255,255,0.045); --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09); --text:#F2F4F9; --text2:#9AA4BD; --text3:#606a85;
  --shadow: 0 20px 60px -25px rgba(0,0,0,0.6);
}
:root[data-theme="light"]{
  --bg:#F3F4FA; --bg2:#EAECF6; --surface:rgba(255,255,255,0.7); --surface2:rgba(255,255,255,0.9);
  --border:rgba(20,25,50,0.08); --text:#171A2B; --text2:#5A6180; --text3:#8A90A8;
  --shadow: 0 20px 50px -25px rgba(30,30,70,0.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,0.16), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(34,211,238,0.12), transparent 55%),
    var(--bg);
  color:var(--text);
  transition:background .3s ease, color .3s ease;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--accent1); color:#fff;}

/* ============ REGISTRATION ============ */
.reg-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.reg-card{
  width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:32px 26px; backdrop-filter:blur(16px); box-shadow:var(--shadow);
}

/* ============ LAYOUT ============ */
#app{max-width:1180px; margin:0 auto; padding:0 20px 110px; position:relative;}
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:16px 4px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  background:linear-gradient(to bottom, var(--bg) 65%, transparent);
}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:19px;}
.brand-mark{width:34px; height:34px; border-radius:11px; background:var(--grad); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -6px rgba(139,92,246,.6); flex-shrink:0;}
.brand-mark svg{width:18px; height:18px;}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.demo-chip{
  font-size:11px; font-weight:600; color:var(--amber); background:rgba(245,166,35,0.12);
  border:1px solid rgba(245,166,35,0.3); padding:5px 10px; border-radius:100px; letter-spacing:.02em;
}
@media(max-width:380px){ .demo-chip{display:none;} }
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--text); transition:.2s;
}
.icon-btn:hover{background:var(--surface2); transform:translateY(-1px);}
.icon-btn svg{width:18px; height:18px;}

/* desktop side nav */
.desktop-nav{display:none;}
@media(min-width:860px){
  .desktop-nav{
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); padding:5px;
    border-radius:100px; backdrop-filter:blur(10px);
  }
  .desktop-nav a{
    padding:8px 16px; border-radius:100px; font-size:14px; font-weight:600; color:var(--text2); transition:.2s;
    display:flex; align-items:center; gap:6px;
  }
  .desktop-nav a.active{background:var(--grad); color:#fff;}
  .bottom-nav{display:none !important;}
  #app{padding-bottom:60px;}
}

.page{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1);}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ============ CARDS / GLASS ============ */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:22px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:var(--shadow);
}
.card.tight{padding:16px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(min-width:640px){.sm\:grid-3{grid-template-columns:repeat(3,1fr);} .sm\:grid-2{grid-template-columns:repeat(2,1fr);}}
@media(max-width:639px){
  .grid-3{grid-template-columns:repeat(2,1fr);}
  #app{padding-left:14px; padding-right:14px;}
  .hero{padding:26px 18px; border-radius:22px;}
  .card{padding:18px; border-radius:18px;}
  .reg-card{padding:26px 20px;}
  .btn{font-size:14px; padding:13px 18px;}
}

.eyebrow{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--accent2);}
.muted{color:var(--text2); font-size:14px; line-height:1.6;}
.small{font-size:12.5px; color:var(--text3);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:15px;
  padding:14px 22px; border-radius:100px; border:none; transition:.2s; white-space:nowrap;
}
.btn-primary{background:var(--grad); color:#fff; box-shadow:0 14px 30px -12px rgba(139,92,246,.55);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 18px 34px -10px rgba(139,92,246,.65);}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface);}
.btn-sm{padding:9px 16px; font-size:13.5px; border-radius:100px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed; transform:none !important;}

.chip{font-size:12px; font-weight:600; padding:5px 11px; border-radius:100px; display:inline-flex; align-items:center; gap:5px;}
.chip-good{background:rgba(61,220,151,.13); color:var(--good);}
.chip-amber{background:rgba(245,166,35,.13); color:var(--amber);}

/* ============ PROGRESS RING ============ */
.ring-wrap{position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.ring-wrap canvas{display:block;}
.ring-center{position:absolute; text-align:center;}
.ring-num{font-family:var(--font-display); font-weight:700; line-height:1;}
.ring-label{font-size:11px; color:var(--text2); margin-top:2px;}

/* ============ HOME ============ */
.hero{
  border-radius:28px; padding:34px 26px; position:relative; overflow:hidden; margin-bottom:18px;
  background:linear-gradient(155deg, rgba(139,92,246,.22), rgba(34,211,238,.10)), var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow);
}
.hero::after{
  content:''; position:absolute; width:280px; height:280px; border-radius:50%; right:-90px; top:-110px;
  background:radial-gradient(circle, rgba(34,211,238,.35), transparent 70%); filter:blur(10px);
}
.hero h1{font-size:clamp(28px,5vw,40px); margin-bottom:8px;}
.hero .tagline{color:var(--text2); font-size:15px; margin-bottom:22px; max-width:420px;}
.upload-drop{
  border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:26px; text-align:center;
  background:var(--surface2); transition:.2s; cursor:pointer;
}
.upload-drop:hover{border-color:var(--accent2);}
.upload-drop svg{width:30px; height:30px; margin-bottom:8px; color:var(--accent2);}

.stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:16px;}
.stat-pill{
  display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border);
  padding:9px 14px; border-radius:100px; font-size:13.5px; font-weight:600;
}

.quick-links{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:18px;}
@media(min-width:640px){.quick-links{grid-template-columns:repeat(4,1fr);}}
.quick-link{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 14px;
  display:flex; flex-direction:column; gap:8px; transition:.2s;
}
.quick-link:hover{transform:translateY(-3px); background:var(--surface2);}
.quick-link .qi{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--grad);}
.quick-link .qi svg{width:17px; height:17px; color:#fff;}
.quick-link .qt{font-weight:600; font-size:14px;}
.quick-link .qs{font-size:12px; color:var(--text2);}

/* ============ ANALYSIS ============ */
.analysis-preview{
  width:100%; aspect-ratio:4/3; max-height:340px; border-radius:var(--radius-md); object-fit:cover;
  border:1px solid var(--border); background:var(--surface2);
}
.scan-overlay{
  position:relative; overflow:hidden; border-radius:var(--radius-md);
}
.scan-line{
  position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--accent2), transparent);
  box-shadow:0 0 16px 4px rgba(34,211,238,.7); animation:scan 1.7s ease-in-out infinite;
}
@keyframes scan{0%{top:4%;} 50%{top:92%;} 100%{top:4%;}}
.loading-text{display:flex; align-items:center; gap:10px; color:var(--text2); font-size:14px; margin-top:14px;}
.dot-pulse{width:8px; height:8px; border-radius:50%; background:var(--accent2); animation:pulse 1s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.3; transform:scale(.8);} 50%{opacity:1; transform:scale(1.15);}}

.metric-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.metric-row:last-child{border-bottom:none;}
.metric-name{font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;}
.bar-track{flex:1; height:7px; background:var(--surface2); border-radius:100px; margin:0 14px; overflow:hidden;}
.bar-fill{height:100%; border-radius:100px; background:var(--grad); width:0%; transition:width 1s cubic-bezier(.2,.8,.2,1);}
.metric-val{font-weight:700; font-size:13.5px; width:38px; text-align:right; font-family:var(--font-display);}

.note-box{
  background:rgba(245,166,35,.07); border:1px solid rgba(245,166,35,.25); border-radius:var(--radius-sm);
  padding:12px 14px; font-size:13px; color:var(--text2); display:flex; gap:10px; align-items:flex-start; margin-top:14px;
}
.note-box svg{width:16px; height:16px; color:var(--amber); flex-shrink:0; margin-top:1px;}

/* ============ ROUTINE ============ */
.task{
  display:flex; align-items:center; gap:14px; padding:14px; border-radius:var(--radius-md); border:1px solid var(--border);
  background:var(--surface); margin-bottom:10px; transition:.2s;
}
.task.done{border-color:rgba(61,220,151,.4); background:rgba(61,220,151,.06);}
.task-check{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; display:flex;
  align-items:center; justify-content:center; transition:.2s;
}
.task.done .task-check{background:var(--good); border-color:var(--good);}
.task-check svg{width:14px; height:14px; color:#fff; opacity:0; transition:.15s;}
.task.done .task-check svg{opacity:1;}
.task-body{flex:1;}
.task-title{font-weight:600; font-size:14.5px;}
.task-time{font-size:12px; color:var(--text3);}
.task-title.strike{text-decoration:line-through; color:var(--text3);}

.toggle{
  width:44px; height:26px; border-radius:100px; background:var(--surface2); border:1px solid var(--border);
  position:relative; transition:.2s; flex-shrink:0;
}
.toggle::after{
  content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:var(--text3); top:2px; left:2px;
  transition:.2s;
}
.toggle.on{background:var(--grad); border-color:transparent;}
.toggle.on::after{transform:translateX(18px); background:#fff;}

/* ============ PROGRESS PAGE ============ */
.seg-control{display:inline-flex; background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:4px; gap:2px;}
.seg-control button{border:none; background:transparent; padding:8px 16px; border-radius:100px; font-size:13px; font-weight:600; color:var(--text2);}
.seg-control button.active{background:var(--grad); color:#fff;}
.chart-wrap{width:100%; overflow-x:auto;}
canvas#lineChart{width:100%; height:220px;}

.history-strip{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;}
.history-card{
  flex:0 0 auto; width:108px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface);
  padding:10px; text-align:center;
}
.history-thumb{width:100%; height:70px; border-radius:9px; margin-bottom:8px; background:var(--grad); opacity:.85;}
.history-date{font-size:11px; color:var(--text3);}
.history-score{font-family:var(--font-display); font-weight:700; font-size:15px;}

/* ============ HAIRSTYLE ============ */
.hs-card{
  border-radius:var(--radius-md); border:1px solid var(--border); background:var(--surface); overflow:hidden; transition:.2s;
}
.hs-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
.hs-thumb{height:130px; position:relative; display:flex; align-items:center; justify-content:center;}
.hs-thumb svg{width:52px; height:52px; color:#fff; opacity:.92;}
.hs-body{padding:14px;}
.hs-name{font-weight:700; font-size:15px; margin-bottom:4px;}
.hs-desc{font-size:12.5px; color:var(--text2); line-height:1.5; margin-bottom:10px; min-height:52px;}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(3,5,12,.6); backdrop-filter:blur(6px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{
  background:var(--bg2); border:1px solid var(--border); border-radius:24px 24px 0 0; max-width:460px; width:100%;
  padding:26px; animation:slideUp .3s ease;
}
@media(min-width:640px){.modal{border-radius:24px;}}
@keyframes slideUp{from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;}}

/* ============ PROFILE ============ */
.avatar{
  width:64px; height:64px; border-radius:20px; background:var(--grad); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:24px; color:#fff; flex-shrink:0;
}
.badge{
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:var(--radius-md);
  border:1px solid var(--border); background:var(--surface); text-align:center; transition:.2s;
}
.badge.locked{opacity:.35; filter:grayscale(1);}
.badge-icon{width:44px; height:44px; border-radius:14px; background:var(--grad); display:flex; align-items:center; justify-content:center;}
.badge-icon svg{width:22px; height:22px; color:#fff;}
.badge-name{font-size:12px; font-weight:600; line-height:1.3;}

.settings-row{display:flex; align-items:center; justify-content:space-between; padding:15px 4px; border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row .sr-left{display:flex; align-items:center; gap:12px;}
.settings-row .sr-icon{width:36px; height:36px; border-radius:10px; background:var(--surface2); display:flex; align-items:center; justify-content:center;}
.settings-row .sr-icon svg{width:17px; height:17px;}
.settings-row .sr-title{font-weight:600; font-size:14px;}
.settings-row .sr-sub{font-size:12px; color:var(--text3);}
.chev{width:16px; height:16px; color:var(--text3);}

input.field{
  width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
  color:var(--text); font-family:var(--font-body); font-size:16px;
}
input.field:focus{outline:2px solid var(--accent2); outline-offset:1px;}

.section-title{font-size:19px; margin-bottom:4px;}
.section-gap{margin-top:26px;}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:space-around;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  background:var(--surface); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text3); font-size:10.5px; font-weight:600; padding:4px 10px; border-radius:12px; transition:.2s;}
.nav-item svg{width:21px; height:21px;}
.nav-item.active{color:var(--accent2);}

/* back link */
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--text2); font-size:13.5px; font-weight:600; margin-bottom:14px;}
.back-link svg{width:15px; height:15px;}

/* toast */
#toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; z-index:200;
  background:var(--surface2); border:1px solid var(--border); backdrop-filter:blur(14px);
  padding:12px 20px; border-radius:100px; font-size:13.5px; font-weight:600; transition:.3s; pointer-events:none;
  box-shadow:var(--shadow); white-space:nowrap;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
@media(min-width:860px){#toast{bottom:30px;}}

input[type="range"]{-webkit-appearance:none; appearance:none; height:6px; border-radius:100px; background:var(--surface2); outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--grad); border:3px solid var(--bg); box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:pointer;}
input[type="range"]::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:var(--accent1); border:3px solid var(--bg); cursor:pointer;}

.reveal{animation:fadeUp .4s ease;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body data-theme="dark">
<div id="toast"></div>
<div id="app"></div>

<script>
/* ============================================================

  camera:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.4" stroke="currentColor" stroke-width="2"/></svg>`,

  user:`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.6" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,

function loadState(){
  try{
    const raw = localStorage.getItem('rooyiman_state');
    if(!raw) return seedDemo(defaultState());
    const s = Object.assign(defaultState(), JSON.parse(raw));
    return s;
  }catch(e){ return seedDemo(defaultState()); }
}
function saveState(){ localStorage.setItem('rooyiman_state', JSON.stringify(state)); }

function seedDemo(s){
  // seed 13 days of plausible upward-trending demo history so charts/progress aren't empty on first run
  let base = 70;
  for(let i=13;i>=1;i--){
    const d = new Date(Date.now()-i*DAY);
    base += (Math.random()*2.4 - 0.6);
    base = Math.min(base, 90);
    const quality = clamp(Math.round(base+ rnd(-4,6)),55,99);
    const symmetry = clamp(Math.round(base+ rnd(-6,4)),50,97);
    const dryness = clamp(Math.round(30 - base*0.15 + rnd(-6,6)),4,60);
    const redness = clamp(Math.round(25 - base*0.12 + rnd(-6,6)),3,55);
    const eyeClarity = clamp(Math.round(base+ rnd(-8,6)),50,98);
    const darkCircles = clamp(Math.round(28 - base*0.1 + rnd(-6,8)),5,55);
    const eyebrows = clamp(Math.round(base+ rnd(-10,8)),50,96);
    const neck = clamp(Math.round(base+ rnd(-8,6)),50,96);
    const hair = clamp(Math.round(base+ rnd(-10,8)),45,95);
    const overall = clamp(Math.round((quality+symmetry+(100-dryness)+(100-redness)+eyeClarity+(100-darkCircles)+eyebrows+neck+hair)/9),50,98);
    s.history.push({date: todayKey(d), quality, symmetry, dryness, redness, eyeClarity, darkCircles, eyebrows, neck, hair, overall});
    s.tasksByDay[todayKey(d)] = {morningPhoto:true, routine: Math.random()>0.15};
  }
  s.streak = 7;
  return s;
}
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- RING RENDER (canvas) ---------- */
function drawRing(canvas, percent, colorA, colorB, trackColor){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size*dpr; canvas.height = size*dpr;
  ctx.scale(dpr,dpr);
  const cx=size/2, cy=size/2, r=size/2-8;
  ctx.lineCap='round';
  ctx.lineWidth=10;
  ctx.strokeStyle = trackColor;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  const grad = ctx.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,colorA); grad.addColorStop(1,colorB);
  ctx.strokeStyle = grad;
  const start = -Math.PI/2;
  const end = start + (Math.PI*2)*(percent/100);
  ctx.beginPath(); ctx.arc(cx,cy,r,start,end); ctx.stroke();
}

function metricRow(name, val, inverse){
  const display = inverse ? (val<20?'кам':val<45?'миёна':'зиёд') : val+'%';
  const barVal = inverse ? 100-val : val;
  return `
  <div class="metric-row">
    <span class="metric-name">${name}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${barVal}%"></div></div>
    <span class="metric-val">${display}</span>
  </div>`;
}

function onFileChosen(e){
  const f = e.target.files[0];
  if(!f) return;
  uploadedImgUrl = URL.createObjectURL(f);
  analysisStage = 'preview';
  render();
}
function resetAnalysis(){
  analysisStage='idle'; uploadedImgUrl=null; lastResult=null; render();
}
function startAnalysis(){
  analysisStage='loading'; render();
  setTimeout(()=>{
    const quality = clamp(Math.round(rnd(85,98)),0,100);
    const symmetry = clamp(Math.round(rnd(78,95)),0,100);
    const dryness = clamp(Math.round(rnd(5,32)),0,100);
    const redness = clamp(Math.round(rnd(4,28)),0,100);
    const eyeClarity = clamp(Math.round(rnd(75,96)),0,100);
    const darkCircles = clamp(Math.round(rnd(8,40)),0,100);
    const eyebrows = clamp(Math.round(rnd(70,95)),0,100);
    const neck = clamp(Math.round(rnd(72,96)),0,100);
    const hair = clamp(Math.round(rnd(70,94)),0,100);
    const overall = clamp(Math.round((quality+symmetry+(100-dryness)+(100-redness)+eyeClarity+(100-darkCircles)+eyebrows+neck+hair)/9),0,100);
    lastResult = {quality,symmetry,dryness,redness,eyeClarity,darkCircles,eyebrows,neck,hair,overall};
    analysisStage='result';
    render();
    setTimeout(()=>{ document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.style.width); },50);
  }, 1800);
}
function saveAnalysis(){
  const key = todayKey();
  const existingIdx = state.history.findIndex(h=>h.date===key);
  const entry = Object.assign({date:key}, lastResult);
  if(existingIdx>=0) state.history[existingIdx]=entry; else state.history.push(entry);
  state.tasksByDay[key] = Object.assign({morningPhoto:true, routine:false}, state.tasksByDay[key]||{});
  state.streak = computeStreak();
  makeThumb(uploadedImgUrl, (dataUrl)=>{
    if(dataUrl){
      state.thumbs[key] = dataUrl;
      // keep only the 12 most recent thumbnails to respect localStorage limits
      const keys = Object.keys(state.thumbs).sort();
      while(keys.length>12){ delete state.thumbs[keys.shift()]; }
    }
    saveState();
  });
  saveState();
  toast('Акс ва натиҷа захира шуд ✅');
  location.hash = '#/progress';
}
function makeThumb(url, cb){
  if(!url) return cb(null);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    try{
      const maxW = 320;
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      const ctx = c.getContext('2d');
      ctx.drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.7));
    }catch(e){ cb(null); }
  };
  img.onerror = ()=>cb(null);
  img.src = url;
}

  state.fullRoutine[key] = state.fullRoutine[key].filter(s=>s.id!==id);

  const inp = document.getElementById('newStep_'+key);

      </div>
      <div id="compareHandle" style="position:absolute; top:0; bottom:0; left:50%; width:3px; background:#fff; box-shadow:0 0 10px rgba(0,0,0,.5); cursor:ew-resize;">

  `;

function updateCompare(val){
  const wrap = document.getElementById('compareWrap');
  const layer = document.getElementById('compareBeforeLayer');
  const img = document.getElementById('compareBeforeImg');
  if(!wrap||!layer) return;
  const w = wrap.offsetWidth;
  layer.style.width = val+'%';
  img.style.width = w+'px';
  document.getElementById('compareHandle').style.left = val+'%';
}

    <div class="eyebrow" style="margin-bottom:12px;">${icon('palette')} Ранги акцентӣ</div>
    <div style="display:flex; gap:10px;">
      ${Object.keys(accentPalettes).map(k=>`
        <button onclick="setAccent('${k}')" style="width:38px; height:38px; border-radius:50%; border:2px solid ${state.accent===k?'var(--text)':'transparent'}; background:linear-gradient(135deg,${accentPalettes[k][0]},${accentPalettes[k][1]});"></button>
      `).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="settings-row">
      <div class="sr-left"><span class="sr-icon">${icon('sun')}</span><div><div class="sr-title">Мавзӯи равшан/торик</div></div></div>
      <div class="toggle ${state.theme==='dark'?'on':''}" onclick="toggleTheme()"></div>
    </div>
    <div class="settings-row">
      <div class="sr-left"><span class="sr-icon">A</span><div><div class="sr-title">Андозаи матн</div></div></div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-ghost btn-sm" onclick="setFontScale(-0.05)">${icon('minus')}</button>
        <button class="btn btn-ghost btn-sm" onclick="setFontScale(0.05)">${icon('plus')}</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="eyebrow" style="margin-bottom:10px;">${icon('bell')} Таърихи огоҳиномаҳо</div>
    ${state.notifLog.length ? state.notifLog.slice(0,8).map(n=>`
      <div class="settings-row"><div class="sr-title" style="font-weight:500;">${n.text}</div><span class="small">${new Date(n.ts).toLocaleTimeString('tg-TJ',{hour:'2-digit',minute:'2-digit'})}</span></div>
    `).join('') : `<p class="muted">Ҳанӯз огоҳинома нест.</p>`}
  </div>

  <div class="card">
    <div class="eyebrow" style="margin-bottom:12px;">Маълумот</div>
    <button class="btn btn-ghost btn-block" style="margin-bottom:10px;" onclick="exportData()">${icon('download')} Содирот кардани маълумот (JSON)</button>
    <button class="btn btn-ghost btn-block" style="color:var(--danger);" onclick="resetData()">${icon('trash')} Тоза кардани ҳамаи маълумот</button>
  </div>
  `;
}
function setAccent(k){ state.accent = k; applyAccent(); saveState(); render(); }
function setFontScale(delta){
  state.fontScale = clamp(Math.round((state.fontScale+delta)*100)/100, 0.85, 1.25);
  document.getElementById('app').style.fontSize = state.fontScale+'em';
  saveState();
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rooyiman-data.json'; a.click();
  toast('Маълумот содир шуд');
}
function resetData(){
  if(!confirm('Оё мутмаин ҳастед? Ҳамаи маълумоти шумо пок карда мешавад.')) return;
  localStorage.removeItem('rooyiman_state');
  location.hash = '#/home';
  location.reload();
}

/* ---------- REGISTRATION GATE ---------- */
function renderRegistration(){
  const app = document.getElementById('app');
  const thisYear = new Date().getFullYear();
  app.innerHTML = `
  <div class="reg-screen">
    <div class="reg-card reveal">
      <div class="brand-mark" style="width:52px; height:52px; border-radius:16px; margin:0 auto 18px;">${I.logo}</div>
      <h1 style="text-align:center; font-size:24px; margin-bottom:6px;">Rӯйи Ман AI</h1>
      <p class="muted" style="text-align:center; margin-bottom:22px;">Ёрдамчии шахсии нигоҳубини намуди зоҳирӣ</p>

      <div class="eyebrow" style="margin-bottom:14px;">${icon('idcard')} Бақайдгирӣ</div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label class="small" style="display:block; margin-bottom:6px;">Ном</label>
          <input class="field" id="regFirst" placeholder="Масалан: Азиз" maxlength="24">
        </div>
        <div>
          <label class="small" style="display:block; margin-bottom:6px;">Фамилия</label>
          <input class="field" id="regLast" placeholder="Масалан: Раҳимов" maxlength="24">
        </div>
        <div>
          <label class="small" style="display:block; margin-bottom:6px;">Соли таваллуд</label>
          <input class="field" id="regYear" type="number" inputmode="numeric" placeholder="Масалан: 2000" min="1930" max="${thisYear}">
        </div>
      </div>
      <div id="regError" class="note-box" style="display:none; margin-top:14px;">${icon('shield')}<span id="regErrorText"></span></div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="submitRegistration()">${icon('check')} Бақайдгирӣ ва оғоз</button>
      <p class="small" style="margin-top:14px; text-align:center; line-height:1.6;">Ин барномаи Реҷаи озмоишӣ (Demo Mode) аст — маълумоти шумо танҳо дар дастгоҳи худи шумо (localStorage) нигоҳ дошта мешавад ва ба ягон сервер фиристода намешавад.</p>
    </div>
  </div>`;
}
function submitRegistration(){
  const first = document.getElementById('regFirst').value.trim();
  const last = document.getElementById('regLast').value.trim();
  const yearRaw = document.getElementById('regYear').value.trim();
  const year = parseInt(yearRaw,10);
  const thisYear = new Date().getFullYear();
  const errEl = document.getElementById('regError');
  const errText = document.getElementById('regErrorText');
  function showErr(msg){ errText.textContent = msg; errEl.style.display='flex'; }
  if(!first || !last){ showErr('Лутфан ном ва фамилияи худро нависед.'); return; }
  if(!yearRaw || isNaN(year) || year<1930 || year>thisYear){ showErr('Лутфан соли таваллуди дурустро ворид кунед.'); return; }
  state.firstName = first;
  state.lastName = last;
  state.birthYear = year;
  state.userName = first;
  state.registered = true;
  state.onboarded = true;
  saveState();
  toast(`Хуш омадед, ${first}! 🎉`);
  boot();
}

/* ---------- ONBOARDING ---------- */
/* ---------- LINE CHART (canvas) ---------- */
function drawLineChart(){
  const canvas = document.getElementById('lineChart');
  if(!canvas) return;
  const h = [...state.history].sort((a,b)=>a.date.localeCompare(b.date)).slice(-progressRange);
  const dpr = window.devicePixelRatio||1;
  const cssW = canvas.parentElement.clientWidth;
  const cssH = 220;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  const pad = {l:34, r:14, t:16, b:26};
  const w = cssW-pad.l-pad.r, hgt = cssH-pad.t-pad.b;
  const isLight = state.theme==='light';
  ctx.strokeStyle = isLight ? 'rgba(20,25,50,0.08)' : 'rgba(255,255,255,0.08)';
  ctx.fillStyle = isLight ? '#5A6180' : '#9AA4BD';
  ctx.font = '11px Inter, sans-serif';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = pad.t + hgt*(i/4);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+w,y); ctx.stroke();
    ctx.fillText(String(100-i*25), 4, y+4);
  }
  if(h.length<2){
    ctx.fillStyle = isLight ? '#5A6180' : '#9AA4BD';
    ctx.textAlign='center';
    ctx.fillText('Барои дидани график ҳадди ақал 2 нуқта лозим аст', cssW/2, cssH/2);
    return;
  }
  const stepX = w/(h.length-1);
  const grad = ctx.createLinearGradient(0,pad.t,0,pad.t+hgt);
  grad.addColorStop(0,'rgba(139,92,246,0.35)');
  grad.addColorStop(1,'rgba(139,92,246,0)');
  ctx.beginPath();
  h.forEach((d,i)=>{
    const x = pad.l+stepX*i, y = pad.t + hgt*(1-d.overall/100);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.l+w, pad.t+hgt); ctx.lineTo(pad.l, pad.t+hgt); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  const lineGrad = ctx.createLinearGradient(0,0,cssW,0);
  lineGrad.addColorStop(0,'#8B5CF6'); lineGrad.addColorStop(1,'#22D3EE');
  h.forEach((d,i)=>{
    const x = pad.l+stepX*i, y = pad.t + hgt*(1-d.overall/100);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = lineGrad; ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.stroke();

  h.forEach((d,i)=>{
    const x = pad.l+stepX*i, y = pad.t + hgt*(1-d.overall/100);
    ctx.beginPath(); ctx.arc(x,y,3.2,0,Math.PI*2);
    ctx.fillStyle = isLight? '#fff':'#0d1120'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#22D3EE'; ctx.stroke();
    if(i===0 || i===h.length-1 || h.length<=8){
      ctx.fillStyle = isLight ? '#5A6180' : '#9AA4BD';
      ctx.textAlign='center';
      ctx.fillText(fmtDate(d.date), x, cssH-6);
    }
  });
}

/* ---------- RENDER ---------- */
function render(){
  const route = currentRoute();
  const map = {
    home: pageHome, analysis: pageAnalysis, routine: pageRoutine,
    progress: pageProgress, hairstyle: pageHairstyle, profile: pageProfile,
    reminders: pageReminders, privacy: pagePrivacy,
    skintype: pageSkinType, fullroutine: pageFullRoutine, wellness: pageWellness,
    report: pageReport, compare: pageCompare, tips: pageTips, settings: pageSettings,
  };
  document.getElementById('app').innerHTML = shell(map[route]());
  requestAnimationFrame(()=>{
    if(route==='home'){
      const c = document.getElementById('homeRing');
      if(c) drawRing(c, todayScore(), '#8B5CF6', '#22D3EE', getComputedStyle(document.body).getPropertyValue('--surface2'));
    }
    if(route==='progress'){ drawLineChart(); }
    if(route==='compare'){ const s=document.getElementById('compareSlider'); if(s) updateCompare(s.value); }
    document.querySelectorAll('.bar-fill').forEach(el=>{
      const w = el.style.width; el.style.width='0%';
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.width=w));
    });
  });
}
window.addEventListener('resize', ()=>{ if(currentRoute()==='progress') drawLineChart(); if(currentRoute()==='home'){const c=document.getElementById('homeRing'); if(c) drawRing(c, todayScore(),'#8B5CF6','#22D3EE',getComputedStyle(document.body).getPropertyValue('--surface2'));}});

applyAccent();
function boot(){
  if(!state.registered){ renderRegistration(); return; }
  render();
  document.getElementById('app').style.fontSize = (state.fontScale||1)+'em';
}
boot();
</script>
